
"openapi": "3.1.0"
"info": {
  "title": "Public REST API – Tec Ref",
  "description": " \u003Cp\u003E Diese Dokumentation beschreibt die technische Referenz der \u003Cstrong\u003EPublic REST API\u003C/strong\u003E von Kasaia auf Basis des OpenAPI-Standards (OAS 3.1). Sie richtet sich an Entwicklerinnen und Entwickler sowie Integratoren, die die API konkret implementieren und die bereitgestellten Endpunkte, Parameter und Datenstrukturen im Detail nachvollziehen möchten. \u003C/p\u003E \u003Cp\u003E Die Public REST API ermöglicht den lesenden Zugriff auf fachlich freigegebene Ergebnis-Artefakte aus Kasaia. Über die API können Stellen identifiziert werden, für die eine Endfassung vorliegt, und die zugehörigen Inhalte strukturiert abgerufen werden, um sie automatisiert in Drittsysteme zu übernehmen. Ausgeliefert wird jeweils die zum Abrufzeitpunkt in Kasaia als Endfassung gekennzeichnete Version einer Stelle. Stellen ohne Endfassung sind über die API nicht zugreifbar. \u003C/p\u003E \u003Cp\u003E Die Authentifizierung gegenüber der API erfolgt über einen API-Key, der bei jedem Request im HTTP-Header zu übermitteln ist. Der API-Key identifiziert den Mandanten und steuert den Zugriff auf die Schnittstelle. Details zur Erstellung und Verwaltung von API-Keys sowie zu Authentifizierungs- und Autorisierungskonzepten sind nicht Bestandteil dieser Referenzdokumentation und werden in einem separaten Dokument beschrieben (siehe &rdquo;API-Schlüssel erstellen und verwalten&ldquo;). \u003C/p\u003E \u003Cp\u003E \u003Ch2\u003EHinweis zur interaktiven Nutzung (&rdquo;Try it out&ldquo;)\u003C/h2\u003E Die interaktive Swagger-Dokumentation auf dieser Seite kann auch direkt in Verbindung mit Ihrem eigenen Kasaia-Mandanten genutzt werden. Hierzu ist ein API-Key erforderlich, den Sie wie im oben genannten Dokument beschrieben einrichten (lassen) können. Über den &rdquo;Authorize!&ldquo;-Button können Sie Ihren API-Key hinterlegen und die API innerhalb dieser Browser-Sitzung direkt gegen Ihren Mandanten testen. \u003C/p\u003E \u003Cp\u003E \u003Ch2\u003EHinweis zur Basis-URL bei Aufruf der beschriebenen Endpunkte in eigenem Code\u003C/h2\u003E Die Basis-URL der hier beschriebenen  \u003C/p\u003E \u003Cp\u003E \u003Ch2\u003EHinweis auf ergänzende Dokumentation\u003C/h2\u003E Diese Swagger-Dokumentation dient als technische Detail- und Referenzdokumentation der Public REST API. Eine einordnende Beschreibung von Kasaia, dem fachlichen Kontext der Anwendung, typischen Einsatzszenarien der Public REST API sowie den allgemeinen technischen und organisatorischen Rahmenbedingungen finden Sie in der Online-Dokumentation unter dem Einstiegspunkt \u003Ca href='https://picture.atlassian.net/wiki/spaces/KPA/overview' target='_blank'\u003Ehttps://picture.atlassian.net/wiki/spaces/KPA/overview\u003C/a\u003E. \u003C/p\u003E",
  "version": "1.0.0"
}
"tags": [
  {
    "name": "PDF herunterladen",
    "description": "Erzeugt ein PDF-Dokument für die Endfassung der angegebenen Stelle."
  }
]
"paths": {
  "/rest/api/v1/stelle/{stellen_ID}/endfassung": {
    "get": {
      "tags": [
        "Stellen laden"
      ],
      "summary": "Eine Stelle laden",
      "description": "Es werden die Inhalte der als Endfassung markierten Dokumentversion der Stelle geliefert -\u003E im Zeitverlauf kann sich die Version ändern.\n- Eine Stelle ist eindeutig über ihre **Stellen_ID** identifizierbar.\n\nHinweis\n- Über diesen Endpunkt können nur Endfassungen gelesen werden – Entwürfe und frühere Endfassungen sind nicht zugänglich.\n",
      "operationId": "Endfassung_laden",
      "parameters": [
        {
          "name": "stellen_ID",
          "in": "path",
          "description": "Die Stellen-ID gibt an, welche Stelle abgerufen werden soll.\n\nStellen, für die eine Endfassung festgelegt wurde, können im Endpunkt [Liste von Stellen laden](#/Stellen%20laden/Stellen_laden) abgerufen werden.\n",
          "required": true,
          "schema": {
            "type": "string"
          },
          "example": "650c4745926eca44ed15da59"
        }
      ],
      "responses": {
        "401": {
          "description": "Unauthorized - API-Key fehlt/ungültig"
        },
        "403": {
          "description": "Forbidden - API-Key gültig, aber Berechtigung für die Operation fehlt."
        },
        "404": {
          "description": "Not Found - Ressource nicht vorhanden (oder aus Privacy-Gründen verborgen)."
        },
        "422": {
          "description": "Unprocessable Entity - Fachliche Validierung fehlgeschlagen."
        },
        "429": {
          "description": "Too Many Requests - Es wurden zu viele Anfragen an die API gesendet. Das Rate-Limit beträgt 60 Anfragen pro Minute und es ist immer nur eine aktive Anfrage erlaubt."
        },
        "200": {
          "description": "Erfolgreich geladen.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/API_Endfassung_DTO"
              }
            }
          }
        }
      },
      "security": [
        {
          "X-Api-Key": []
        }
      ]
    }
  },
  "/rest/api/v1/stellen/endfassung": {
    "get": {
      "tags": [
        "Stellen laden"
      ],
      "summary": "Liste von Stellen laden",
      "description": "Dieser Endpunkt liefert eine Liste von Stellen.\nEs werden alle Stellen berücksichtigt, für die seit dem abgefragten Zeitpunkt (festgelegt_seit) eine Endfassung festgelegt wurden.\n- Diese Liste soll die Stellen liefern, für die eine Aktualisierung notwendig ist, und dient als Input für weitere Endpunkte.\n    - Über den Endpunkt [Eine Stelle laden](#/Stellen%20laden/Endfassung_laden) können weitere Daten einer Stelle (**Stellen_ID**) abgefragt werden.\n    - Über den Endpunkt [PDF erzeugen und herunterladen](#/PDF%20herunterladen/PDF_herunterladen) kann für die Stelle ein PDF erzeugt werden.\n- Eine Stelle ist eindeutig über ihre **Stellen_ID** identifizierbar.\n\nHinweis\n- Dieser Endpunkt dient nicht dazu, Inhalte von Stellen abzufragen. Hierfür ist der Endpunkt [Eine Stelle laden](#/Stellen%20laden/Endfassung_laden) vorgesehen.\n",
      "operationId": "Stellen_laden",
      "parameters": [
        {
          "name": "festgelegt_seit",
          "in": "query",
          "description": "Es werden nur Stellen ausgeliefert, für die nach dem abgefragten Zeitpunkt, eine Endfassung festgelegt wurde.\\\nFormatierung in ISO-8601-Format (UTC) - **yyyy-MM-dd'T'HH:mm:ss.SSSX**\n\nStellen für die eine Endfassung vor diesem Zeitpunkt festgelegt wurde, werden hier nicht berücksichtigt.\n",
          "required": true,
          "schema": {
            "type": "string",
            "format": "date-time"
          },
          "example": "2025-07-06T08:12:45.321Z"
        }
      ],
      "responses": {
        "401": {
          "description": "Unauthorized - API-Key fehlt/ungültig"
        },
        "403": {
          "description": "Forbidden - API-Key gültig, aber Berechtigung für die Operation fehlt."
        },
        "404": {
          "description": "Not Found - Ressource nicht vorhanden (oder aus Privacy-Gründen verborgen)."
        },
        "422": {
          "description": "Unprocessable Entity - Fachliche Validierung fehlgeschlagen."
        },
        "429": {
          "description": "Too Many Requests - Es wurden zu viele Anfragen an die API gesendet. Das Rate-Limit beträgt 60 Anfragen pro Minute und es ist immer nur eine aktive Anfrage erlaubt."
        },
        "200": {
          "description": "Erfolgreich geladen.",
          "content": {
            "application/json": {
              "schema": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/API_Stelle_DTO"
                }
              }
            }
          }
        }
      },
      "security": [
        {
          "X-Api-Key": []
        }
      ]
    }
  },
  "/rest/api/v1/exportprofile": {
    "get": {
      "tags": [
        "PDF herunterladen"
      ],
      "summary": "Exportprofile laden",
      "description": "Dieser Endpunkt liefert alle aktiven Exportprofile.\n- Ein **Exportprofil** legt fest, in welcher Form eine Stelle in ein PDF exportiert wird.\nEs definiert z. B. Layout, Umfang oder welche Felder enthalten sind\n([Bedienleitfaden-Exportprofile](handbuch/HTML/exportprofile-konfigurieren.html)).\n- Über den Endpunkt [PDF erzeugen und herunterladen](#/PDF%20herunterladen/PDF_herunterladen) kann mit dem Exportprofil ein PDF erzeugt werden.\n- Jedes Exportprofil ist eindeutig über eine **Exportprofil_ID** identifizierbar.\n\n➡️ Für externe Systeme heißt das: Entwickler wählen ein Exportprofil, um gewünschte Stelleninformationen automatisch als PDF abzurufen.\n\nHinweis\n- Dieser Endpunkt dient nicht dazu, Daten einer Stelle abzufragen.\n- Die Einstellungen von Exportprofilen können nicht abgefragt werden.\n",
      "operationId": "Exportprofile_laden",
      "responses": {
        "401": {
          "description": "Unauthorized - API-Key fehlt/ungültig"
        },
        "403": {
          "description": "Forbidden - API-Key gültig, aber Berechtigung für die Operation fehlt."
        },
        "404": {
          "description": "Not Found - Ressource nicht vorhanden (oder aus Privacy-Gründen verborgen)."
        },
        "422": {
          "description": "Unprocessable Entity - Fachliche Validierung fehlgeschlagen."
        },
        "429": {
          "description": "Too Many Requests - Es wurden zu viele Anfragen an die API gesendet. Das Rate-Limit beträgt 60 Anfragen pro Minute und es ist immer nur eine aktive Anfrage erlaubt."
        },
        "200": {
          "description": "Erfolgreich geladen.",
          "content": {
            "application/json": {
              "schema": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/API_Exportprofil_DTO"
                }
              }
            }
          }
        }
      },
      "security": [
        {
          "X-Api-Key": []
        }
      ]
    }
  },
  "/rest/api/v1/pdf/stelle/{stellen_ID}/exportprofil/{exportprofil_ID}": {
    "get": {
      "tags": [
        "PDF herunterladen"
      ],
      "summary": "PDF erzeugen und herunterladen",
      "description": "Dieser Endpunkt stellt die Inhalte der als Endfassung markierten Dokumentversion der Stelle zum Herunterladen als PDF bereit -\u003E im Zeitverlauf kann sich die Version ändern.\\\nDas PDF wird mit dem übergebenen Exportprofil (**exportprofil_ID**) für die übergebene Stelle (**stellen_ID**) erzeugt.\n- Ein **Exportprofil** legt fest, in welcher Form eine Stelle in ein PDF exportiert wird.\nEs definiert z. B. Layout, Umfang oder welche Felder enthalten sind\n([Bedienleitfaden-Exportprofile](handbuch/HTML/exportprofile-konfigurieren.html)).\n- Über den Endpunkt [Exportprofile laden](#/PDF%20herunterladen/Exportprofile_laden) kann eine Liste der verfügbaren Exportprofile (**Exportprofil_ID**) geladen werden.\n- Über den Endpunkt [Liste von Stellen laden](#/Stellen%20laden/Stellen_laden) kann eine Liste von Stellen (**Stellen_ID**) geladen werden, für die eine Endfassung festgelegt wurde.\n\nHinweis\n- Dieser Endpunkt dient nicht dazu, Inhalte von Stellen abzufragen. Hierfür ist der Endpunkt [Eine Stelle laden](#/Stellen%20laden/Endfassung_laden) vorgesehen.\n- Für Entwürfe können keine PDFs erzeugt und heruntergeladen werden.\n",
      "operationId": "PDF_herunterladen",
      "parameters": [
        {
          "name": "exportprofil_ID",
          "in": "path",
          "description": "Die Exportprofil-ID gibt an, welches Exportprofil für das Erstellen der PDF verwendet werden soll.\n\nAlle möglichen Exportprofil_IDs können im REST-Endpunkt [Exportprofile laden](#/PDF%20herunterladen/Exportprofile_laden) abgerufen werden.",
          "required": true,
          "schema": {
            "type": "string"
          },
          "example": "650c4745926eca44ed15dadb"
        },
        {
          "name": "stellen_ID",
          "in": "path",
          "description": "Die Stellen-ID gibt an, für welche Stelle ein PDF erzeugt werden soll.\n\nAlle möglichen Stellen_IDs können im REST-Endpunkt [Liste von Stellen laden](#/Stellen%20laden/Stellen_laden) abgerufen werden.",
          "required": true,
          "schema": {
            "type": "string"
          },
          "example": "650c4745926eca44ed15da59"
        }
      ],
      "responses": {
        "401": {
          "description": "Unauthorized - API-Key fehlt/ungültig"
        },
        "403": {
          "description": "Forbidden - API-Key gültig, aber Berechtigung für die Operation fehlt."
        },
        "404": {
          "description": "Not Found - Ressource nicht vorhanden (oder aus Privacy-Gründen verborgen)."
        },
        "422": {
          "description": "Unprocessable Entity - Fachliche Validierung fehlgeschlagen."
        },
        "429": {
          "description": "Too Many Requests - Es wurden zu viele Anfragen an die API gesendet. Das Rate-Limit beträgt 60 Anfragen pro Minute und es ist immer nur eine aktive Anfrage erlaubt."
        },
        "200": {
          "description": "PDF wurde erfolgreich erstellt.",
          "content": {
            "application/pdf": {

            }
          }
        }
      },
      "security": [
        {
          "X-Api-Key": []
        }
      ]
    }
  }
}
